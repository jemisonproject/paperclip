# QA testing environment — runs on the UGREEN NAS alongside Paperclip.
#
# Spins up the web app + API + database from the paperclip-features branch
# so the QA agent can browse and visually verify changes before merging
# to main.
#
# Prerequisites:
#   - api/ and web/ repos cloned as siblings of this directory
#   - Each repo must have its own .env file with secrets (gitignored)
#
# Usage:
#   ./scripts/qa-rebuild.sh
#   docker compose -f docker-compose.qa.yml up --build -d
#   docker compose -f docker-compose.qa.yml logs -f
#   docker compose -f docker-compose.qa.yml down

name: koiomi-qa

services:
  qa-db:
    image: postgres:18-alpine
    container_name: qa-db
    environment:
      POSTGRES_DB: koiomi_qa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - qa-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d koiomi_qa"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qa-api:
    build:
      context: ${QA_API_PATH:-../api}
      dockerfile: Dockerfile
      target: dev
    container_name: qa-api
    env_file:
      - ${QA_API_PATH:-../api}/.env
    environment:
      - POSTGRES_HOST=qa-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=koiomi_qa
      - DB_SSL=false
      - DB_SYNC=true
      - FRONTEND_URL=http://localhost:7070
      - CORS_ORIGIN=http://localhost:7070
    volumes:
      - ${QA_API_PATH:-../api}:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      qa-db:
        condition: service_healthy
    restart: unless-stopped

  qa-web:
    build:
      context: ${QA_WEB_PATH:-../web}
      dockerfile: apps/main/Dockerfile.dev
      args:
        VITE_GRAPHQL_ENDPOINT: /api/graphql
    container_name: qa-web
    env_file:
      - ${QA_WEB_PATH:-../web}/.env
    environment:
      - GRAPHQL_ENDPOINT=http://qa-api:3000/graphql
      - VITE_GRAPHQL_ENDPOINT=/api/graphql
      - NODE_ENV=development
      - PORT=4000
    ports:
      - "7070:4000"
    depends_on:
      - qa-api
    restart: unless-stopped

volumes:
  qa-pgdata:
